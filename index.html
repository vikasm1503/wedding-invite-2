<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAVE THE DATE • Mansi & Vikas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0d14;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Backdrop for Laptops */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      background: url('couple.jpg') center/cover no-repeat;
      filter: blur(25px) brightness(0.3);
      transform: scale(1.1);
      z-index: 0;
    }

    /* App Frame Container */
    .app-frame {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 420px;
      max-height: 850px;
      background: url('couple.jpg') center/cover no-repeat;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }

    @media (min-width: 768px) {
      .app-frame {
        border: 4px solid #1e293b;
        border-radius: 32px;
      }
    }

    .comic-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.12);
      z-index: 1;
      pointer-events: none;
    }

    /* Top Headline */
    .top-headline {
      position: absolute;
      top: 2%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Bungee', cursive;
      font-size: clamp(0.85rem, 3.5vw, 1.05rem);
      color: #ffde00;
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000;
      letter-spacing: 0.5px;
      z-index: 20;
    }

    /* Elongated & Tilted Comic Top Control Bar */
    .top-control-bar {
      position: absolute;
      top: 8.5%;
      left: 3%;
      right: 3%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 25;
      gap: 8px;
    }

    .comic-badge {
      border: 3px solid #000;
      border-radius: 14px;
      padding: 8px 12px;
      font-family: 'Bungee', cursive;
      font-size: 0.52rem;
      color: #000;
      text-decoration: none;
      box-shadow: 4px 4px 0px #000;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
      flex: 1;
    }
    .comic-badge:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

    .date-badge { background: #38bdf8; transform: rotate(-3deg); }
    .sound-badge { background: #f472b6; transform: rotate(1.5deg); }
    .venue-badge { background: #ffde00; transform: rotate(-2deg); }

    /* Right-Side Polaroid (Phere) */
    .comic-polaroid-right {
      position: absolute;
      top: 22%;
      right: 4%;
      background: #fff;
      border: 2px solid #000;
      padding: 6px 6px 18px 6px;
      width: 70px;
      box-shadow: 4px 4px 0px #000;
      transform: rotate(6deg);
      z-index: 15;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .comic-polaroid-right:hover { transform: rotate(4deg) scale(1.05); }
    .comic-polaroid-right img {
      width: 100%;
      height: 60px;
      object-fit: cover;
      border: 1px solid #000;
    }
    .comic-polaroid-right span {
      display: block;
      font-family: 'Bungee', cursive;
      font-size: 0.33rem;
      color: #000;
      text-align: center;
      margin-top: 4px;
    }

    /* Left-Side Top Polaroid (Halفi) */
    .comic-polaroid-left-top {
      position: absolute;
      top: 22%;
      left: 4%;
      background: #fff;
      border: 2px solid #000;
      padding: 6px 6px 18px 6px;
      width: 65px;
      box-shadow: 4px 4px 0px #000;
      transform: rotate(-7deg);
      z-index: 15;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .comic-polaroid-left-top:hover { transform: rotate(-5deg) scale(1.05); }
    .comic-polaroid-left-top img {
      width: 100%;
      height: 55px;
      object-fit: cover;
      border: 1px solid #000;
    }
    .comic-polaroid-left-top span {
      display: block;
      font-family: 'Bungee', cursive;
      font-size: 0.33rem;
      color: #000;
      text-align: center;
      margin-top: 4px;
    }

    /* Left-Side Bottom Polaroid (Sangeet - Placed a bit down) */
    .comic-polaroid-left-bottom {
      position: absolute;
      top: 40%;
      left: 5%;
      background: #fff;
      border: 2px solid #000;
      padding: 6px 6px 18px 6px;
      width: 65px;
      box-shadow: 4px 4px 0px #000;
      transform: rotate(4deg);
      z-index: 15;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .comic-polaroid-left-bottom:hover { transform: rotate(2deg) scale(1.05); }
    .comic-polaroid-left-bottom img {
      width: 100%;
      height: 55px;
      object-fit: cover;
      border: 1px solid #000;
    }
    .comic-polaroid-left-bottom span {
      display: block;
      font-family: 'Bungee', cursive;
      font-size: 0.33rem;
      color: #000;
      text-align: center;
      margin-top: 4px;
    }

    /* Lightbox Modal for Polaroids */
    .lightbox-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-card {
      background: #fff;
      border: 4px solid #000;
      padding: 10px 10px 24px 10px;
      max-width: 280px;
      width: 100%;
      box-shadow: 8px 8px 0px #000;
      transform: rotate(-2deg);
      text-align: center;
    }
    .lightbox-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border: 2px solid #000;
    }
    .lightbox-card p {
      font-family: 'Bungee', cursive;
      font-size: 0.7rem;
      color: #000;
      margin-top: 10px;
    }
    .close-hint {
      margin-top: 20px;
      font-family: 'Bungee', cursive;
      font-size: 0.6rem;
      color: #ffde00;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid #ffde00;
    }

    /* Bottom Compact Banner with Dates Included */
    .bottom-banner {
      position: absolute;
      bottom: 3%;
      left: 4%;
      right: 4%;
      background: #fffbeb;
      border: 3px solid #000;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      box-shadow: 4px 4px 0px #000;
      z-index: 20;
    }

    .banner-names {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 1px;
    }

    .banner-subtitle {
      font-family: 'Bungee', cursive;
      font-size: 0.58rem;
      color: #dc2626;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Ambient Backdrop for Laptops -->
  <div class="ambient-backdrop"></div>

  <!-- Background Audio Track -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- Responsive App Frame Container -->
  <div class="app-frame" id="appFrame">
    <div class="comic-overlay"></div>

    <!-- Top Headline -->
    <div class="top-headline">THE TIME IS ALMOST HERE!</div>

    <!-- Left-Side Top Polaroid: Haldi 30 Jan -->
    <div class="comic-polaroid-left-top" onclick="openLightbox('polaroid1.jpg', 'HALDI • 30 JAN')">
      <img src="polaroid1.jpg" alt="Haldi" onerror="this.src='couple.jpg'">
      <span>TAP TO VIEW</span>
    </div>

    <!-- Left-Side Bottom Polaroid: Sangeet 30th Jan -->
    <div class="comic-polaroid-left-bottom" onclick="openLightbox('polaroid2.jpg', 'SANGEET • 30TH JAN')">
      <img src="polaroid2.jpg" alt="Sangeet" onerror="this.src='couple.jpg'">
      <span>TAP TO VIEW</span>
    </div>

    <!-- Right-Side Polaroid: Phere 31st Jan -->
    <div class="comic-polaroid-right" onclick="openLightbox('polaroid3.jpg', 'PHERE • 31ST JAN')">
      <img src="polaroid3.jpg" alt="Phere" onerror="this.src='couple.jpg'">
      <span>TAP TO VIEW</span>
    </div>

    <!-- Top Elongated & Tilted Control Bar -->
    <div class="top-control-bar">
      <!-- Calendar Pill -->
      <a 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+Mansi+and+Vikas+at+Geetashree+Garden!&location=Geetashree+Garden,+Nagda,+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-badge date-badge"
      >
        📅 JAN 30-31<br><span style="color:#dc2626; font-size:0.38rem;">+ ADD CAL</span>
      </a>

      <!-- Sound Toggle Status Pill -->
      <div class="comic-badge sound-badge" id="soundTogglePill">
        🎵 SOUND<br><span id="soundStatus" style="color:#000; font-size:0.38rem;">OFF</span>
      </div>

      <!-- Venue Map Pill -->
      <a 
        href="https://maps.google.com/?q=Geetashree+Garden+Nagda+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-badge venue-badge"
      >
        📍 VENUE<br><span style="color:#0369a1; font-size:0.38rem;">MAPS →</span>
      </a>
    </div>

    <!-- Lightbox Modal Popup -->
    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
      <div class="lightbox-card" onclick="event.stopPropagation()">
        <img id="lightboxImg" src="" alt="Giblified Photo">
        <p id="lightboxCaption">EVENT</p>
      </div>
      <div class="close-hint">✕ TAP ANYWHERE TO CLOSE</div>
    </div>

    <!-- Bottom Compact Banner with Dates Included -->
    <div class="bottom-banner">
      <div class="banner-names">Mansi &amp; Vikas</div>
      <div class="banner-subtitle">JAN 30 &amp; 31, 2027 • NAGDA, M.P.</div>
    </div>

  </div>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const soundStatus = document.getElementById('soundStatus');
    const soundTogglePill = document.getElementById('soundTogglePill');
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    let isPlaying = false;

    function toggleAudio() {
      if (isPlaying) {
        bgMusic.pause();
        soundStatus.textContent = 'OFF';
        soundTogglePill.style.background = '#f472b6';
      } else {
        bgMusic.play().then(() => {
          soundStatus.textContent = 'ON';
          soundTogglePill.style.background = '#4ade80';
        }).catch((err) => {
          console.log("Audio play blocked:", err);
        });
      }
      isPlaying = !isPlaying;
    }

    // Tap anywhere inside app frame to toggle sound (unless clicking links or polaroids)
    document.addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('[class*="comic-polaroid"]') || lightboxModal.classList.contains('active')) return;
      toggleAudio();
    });

    soundTogglePill.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAudio();
    });

    // Lightbox functions for Polaroids
    function openLightbox(imgSrc, captionText) {
      lightboxImg.src = imgSrc;
      lightboxCaption.textContent = captionText;
      lightboxModal.classList.add('active');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('active');
    }
  </script>
</body>
</html>
