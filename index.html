<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAVE THE DATE • Mansi & Vikas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f17;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    /* Full-Screen Edge-to-Edge Comic Background Photo */
    .bg-container {
      position: fixed;
      inset: 0;
      background: url('couple.jpg') center/cover no-repeat;
      z-index: 0;
    }

    /* Soft vignette so text is readable without hiding the picture */
    .vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,0.75) 75%, rgba(0,0,0,0.95) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Top-Left Location Pin (Near Hotel) */
    .top-left-location {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 50;
    }

    .hotel-pin-btn {
      background: #ffde00;
      border: 3px solid #000;
      color: #000;
      font-family: 'Bungee', cursive;
      font-size: 0.7rem;
      padding: 8px 14px;
      border-radius: 20px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 3px 3px 0px #000;
      transition: transform 0.1s;
    }
    .hotel-pin-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    /* Bottom-Center Floating Text Layout (No Cards) */
    .bottom-content {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .comic-names {
      font-family: 'Bungee', cursive;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      margin-bottom: 6px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .comic-tagline {
      font-family: 'Bungee', cursive;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      color: #facc15;
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    /* Calendar & Action Row */
    .date-action-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #fff;
      padding: 10px 18px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .date-text {
      font-family: 'Bungee', cursive;
      font-size: 0.85rem;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .cal-sync-btn {
      background: #f472b6;
      border: 2px solid #000;
      color: #000;
      font-family: 'Bungee', cursive;
      font-size: 0.65rem;
      padding: 6px 12px;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 2px 2px 0px #000;
      transition: transform 0.1s;
    }
    .cal-sync-btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Background Comic Image -->
  <div class="bg-container"></div>
  <div class="vignette"></div>

  <!-- Background Audio Track -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- Top-Left Hotel / Venue Location Button -->
  <div class="top-left-location">
    <a 
      href="https://maps.google.com/?q=Geetashree+Garden+Nagda+Madhya+Pradesh" 
      target="_blank" 
      rel="noopener noreferrer"
      class="hotel-pin-btn"
    >
      <span>📍</span> VENUE MAP
    </a>
  </div>

  <!-- Bottom-Center Clean Text & Date Information -->
  <div class="bottom-content">
    <div class="comic-names">Mansi &amp; Vikas</div>
    <div class="comic-tagline">Save The Date</div>

    <div class="date-action-box">
      <div class="date-text">JAN 30 &amp; 31, 2027</div>
      <a 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+Mansi+and+Vikas+at+Geetashree+Garden!&location=Geetashree+Garden,+Nagda,+Madhya+Pradesh" 
        target="_blank"
        rel="noopener noreferrer"
        class="cal-sync-btn"
      >
        + CALENDAR
      </a>
    </div>
  </div>

  <script>
    // Automatic Background Music Playback
    window.addEventListener('DOMContentLoaded', () => {
      const bgMusic = document.getElementById('bgMusic');
      bgMusic.play().catch(() => {
        document.body.addEventListener('click', () => {
          bgMusic.play();
        }, { once: true });
      });
    });
  </script>
</body>
</html>
