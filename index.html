<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAVE THE DATE • Mansi & Vikas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f17;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    /* Full-Screen Edge-to-Edge Comic Background */
    .figma-canvas {
      position: fixed;
      inset: 0;
      background: url('couple.jpg') center/cover no-repeat;
      z-index: 0;
    }

    .comic-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      z-index: 1;
      pointer-events: none;
    }

    /* Artboard Frame */
    .figma-artboard {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 450px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* 1. Top Mini Headline */
    .top-headline {
      position: absolute;
      top: 2%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Bungee', cursive;
      font-size: clamp(0.85rem, 3.5vw, 1.1rem);
      color: #ffde00;
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000;
      letter-spacing: 0.5px;
      z-index: 20;
    }

    /* Top-Center Audio Toggle Pill */
    .audio-toggle-pill {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 2px solid #000;
      border-radius: 16px;
      padding: 5px 12px;
      font-family: 'Bungee', cursive;
      font-size: 0.5rem;
      color: #000;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;
      z-index: 30;
      transition: transform 0.1s;
    }
    .audio-toggle-pill:active { transform: translateX(-50%) translate(1px, 1px); box-shadow: 1px 1px 0px #000; }

    /* 2. Venue Map Pill (Tucked neatly top-right) */
    .venue-pill {
      position: absolute;
      top: 8%;
      right: 4%;
      background: #ffde00;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 6px 10px;
      font-family: 'Bungee', cursive;
      font-size: 0.52rem;
      color: #000;
      text-decoration: none;
      box-shadow: 3px 3px 0px #000;
      z-index: 20;
      transform: rotate(2deg);
    }
    .venue-pill:active { transform: rotate(2deg) translate(1px, 1px); box-shadow: 1px 1px 0px #000; }

    /* 3. Date & Calendar Pill (Tucked neatly top-left) */
    .date-pill {
      position: absolute;
      top: 8%;
      left: 4%;
      background: #38bdf8;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 6px 10px;
      font-family: 'Bungee', cursive;
      font-size: 0.52rem;
      color: #000;
      text-decoration: none;
      box-shadow: 3px 3px 0px #000;
      z-index: 20;
      transform: rotate(-2deg);
      text-align: center;
    }
    .date-pill:active { transform: rotate(-2deg) translate(1px, 1px); box-shadow: 1px 1px 0px #000; }

    /* 4. Bottom Compact Banner */
    .bottom-banner {
      position: absolute;
      bottom: 3%;
      left: 4%;
      right: 4%;
      background: #fffbeb;
      border: 3px solid #000;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      box-shadow: 4px 4px 0px #000;
      z-index: 20;
    }

    .banner-names {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 1px;
    }

    .banner-subtitle {
      font-family: 'Bungee', cursive;
      font-size: 0.6rem;
      color: #dc2626;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Background Art & Overlay -->
  <div class="figma-canvas"></div>
  <div class="comic-overlay"></div>

  <!-- Background Audio Track -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- Artboard Frame -->
  <div class="figma-artboard">

    <!-- Top Headline -->
    <div class="top-headline">THE TIME IS ALMOST HERE!</div>

    <!-- Top-Center Sound Toggle Pill (On/Off Tap Control) -->
    <div class="audio-toggle-pill" id="audioToggleBtn">
      🔊 SOUND: <span id="soundStatus">ON</span>
    </div>

    <!-- Top-Left: Calendar Sync Pill -->
    <a 
      href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+Mansi+and+Vikas+at+Geetashree+Garden!&location=Geetashree+Garden,+Nagda,+Madhya+Pradesh" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="date-pill"
    >
      📅 JAN 30-31, '27<br><span style="color:#dc2626; font-size:0.45rem;">+ ADD TO CALENDAR</span>
    </a>

    <!-- Top-Right: Venue Map Pill -->
    <a 
      href="https://maps.google.com/?q=Geetashree+Garden+Nagda+Madhya+Pradesh" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="venue-pill"
    >
      📍 GEETASHREE GARDEN<br><span style="color:#0369a1; font-size:0.45rem;">OPEN MAPS →</span>
    </a>

    <!-- Bottom Compact Banner -->
    <div class="bottom-banner">
      <div class="banner-names">Mansi &amp; Vikas</div>
      <div class="banner-subtitle">Save The Date • Nagda, M.P.</div>
    </div>

  </div>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const audioToggleBtn = document.getElementById('audioToggleBtn');
    const soundStatus = document.getElementById('soundStatus');
    let isPlaying = false;

    // Automatic Audio Playback Attempt on Load
    window.addEventListener('DOMContentLoaded', () => {
      bgMusic.play().then(() => {
        isPlaying = true;
        soundStatus.textContent = 'ON';
      }).catch(() => {
        isPlaying = false;
        soundStatus.textContent = 'OFF';
      });
    });

    // On-tap Sound Toggle Control (On / Off)
    audioToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isPlaying) {
        bgMusic.pause();
        soundStatus.textContent = 'OFF';
        audioToggleBtn.style.background = '#fca5a5';
        isPlaying = false;
      } else {
        bgMusic.play().then(() => {
          soundStatus.textContent = 'ON';
          audioToggleBtn.style.background = '#86efac';
          isPlaying = true;
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
