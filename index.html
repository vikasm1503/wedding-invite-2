<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Save The Date • Mansi & Vikas</title>

  <!-- Open Graph Social Media Previews -->
  <meta property="og:title" content="Save The Date • Mansi & Vikas" />
  <meta property="og:description" content="January 30 & 31, 2027 | Nagda, Madhya Pradesh" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #08080a;
      --gold-primary: #dfb15b;
      --gold-gradient: linear-gradient(135deg, #f7e1b5 0%, #dfb15b 50%, #c59341 100%);
      --glass-bg: rgba(18, 20, 26, 0.65);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Cinematic Ambient Backdrop */
    .backdrop-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .backdrop-image {
      position: absolute;
      inset: -20px;
      /* If you uploaded couple.jpg, change the URL to 'couple.jpg' */
      background: url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200') center/cover no-repeat;
      filter: blur(30px) brightness(0.35);
      transform: scale(1.1);
    }
    .backdrop-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(8,8,10,0.2) 0%, rgba(8,8,10,0.85) 100%);
    }

    /* Floating Audio Player */
    .audio-dock {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 50;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 50px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.2s ease;
    }
    .audio-dock:active { transform: scale(0.95); }
    .audio-label { font-size: 0.75rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-primary); }
    .vinyl-icon { font-size: 1.1rem; display: inline-block; }
    .rotating { animation: spin 3s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Hybrid Shell Frame */
    .hybrid-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 20px;
    }

    @media (min-width: 768px) {
      .hybrid-wrapper {
        min-height: auto;
        height: 85vh;
        max-height: 750px;
        border-radius: 36px;
        border: 1px solid var(--glass-border);
        background: rgba(12, 14, 18, 0.75);
        backdrop-filter: blur(30px);
        box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        overflow-y: auto;
      }
    }

    /* Header Badge */
    .top-badge {
      text-align: center;
      margin-bottom: auto;
    }
    .badge-pill {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-primary);
      background: rgba(223, 177, 91, 0.1);
      border: 1px solid rgba(223, 177, 91, 0.25);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    /* Center Focus Section */
    .center-content {
      text-align: center;
      margin: 24px 0;
    }

    .names-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 8vw, 2.8rem);
      font-weight: 600;
      line-height: 1.2;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .ampersand {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--gold-primary);
      -webkit-text-fill-color: var(--gold-primary);
      display: block;
      margin: 2px 0;
    }

    .date-pill-box {
      font-size: 1.1rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 1px;
      margin-top: 14px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .location-box {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* Live Countdown Grid */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 20px 0;
    }
    .time-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .time-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }
    .time-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Action Dock */
    .action-dock {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .primary-btn {
      background: var(--gold-gradient);
      color: #0b0d12;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      padding: 15px 24px;
      border-radius: 999px;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(223, 177, 91, 0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .primary-btn:active { transform: scale(0.96); }

    .secondary-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Ambient Cinematic Background -->
  <div class="backdrop-container">
    <div class="backdrop-image"></div>
    <div class="backdrop-overlay"></div>
  </div>

  <!-- Audio Toggle Dock -->
  <div class="audio-dock" id="musicToggle">
    <span class="audio-label" id="audioLabel">Sound</span>
    <span class="vinyl-icon" id="vinylIcon">🎵</span>
  </div>

  <!-- Background Audio Track -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mp3">
  </audio>

  <!-- Main Responsive Hybrid Container -->
  <div class="hybrid-wrapper">
    
    <!-- Top Header -->
    <div class="top-badge">
      <span class="badge-pill">Save The Date</span>
    </div>

    <!-- Center Typography & Focus -->
    <div class="center-content">
      <div class="names-heading">
        Mansi Karandikar
        <span class="ampersand">&amp;</span>
        Vikas Mishra
      </div>
      <div class="date-pill-box">January 30 &amp; 31, 2027</div>
      <div class="location-box">📍 Nagda, Madhya Pradesh</div>

      <!-- Live Dynamic Countdown -->
      <div class="countdown-grid">
        <div class="time-box">
          <div class="time-value" id="days">00</div>
          <div class="time-label">Days</div>
        </div>
        <div class="time-box">
          <div class="time-value" id="hours">00</div>
          <div class="time-label">Hours</div>
        </div>
        <div class="time-box">
          <div class="time-value" id="minutes">00</div>
          <div class="time-label">Mins</div>
        </div>
        <div class="time-box">
          <div class="time-value" id="seconds">00</div>
          <div class="time-label">Secs</div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-dock">
      <a 
        class="primary-btn" 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+the+wedding+celebrations+of+Mansi+and+Vikas+in+Nagda!&location=Nagda,+Madhya+Pradesh" 
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🗓️</span> Add to Google Calendar
      </a>
      <div class="secondary-info">Tap to block your calendar automatically</div>
    </div>

  </div>

  <script>
    // Audio Player Controller
    const musicToggle = document.getElementById('musicToggle');
    const vinylIcon = document.getElementById('vinylIcon');
    const audioLabel = document.getElementById('audioLabel');
    const bgMusic = document.getElementById('bgMusic');
    let isPlaying = false;

    musicToggle.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        vinylIcon.classList.remove('rotating');
        vinylIcon.textContent = '🔈';
        audioLabel.textContent = 'Muted';
      } else {
        bgMusic.play().then(() => {
          vinylIcon.classList.add('rotating');
          vinylIcon.textContent = '🎶';
          audioLabel.textContent = 'Playing';
        }).catch(() => {});
      }
      isPlaying = !isPlaying;
    });

    // Live Countdown Logic (Target: Jan 30, 2027)
    const weddingDate = new Date('January 30, 2027 00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = weddingDate - now;

      if (distance < 0) return;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
