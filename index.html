<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAVE THE DATE • Mansi & Vikas</title>

  <!-- Google Fonts: Bungee (Comic Font) & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f17;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    /* Full-Screen Comic Background Image */
    .figma-canvas {
      position: fixed;
      inset: 0;
      background: url('couple.jpg') center/cover no-repeat;
      z-index: 0;
    }

    /* Subtle comic overlay styling */
    .comic-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Layout Wrapper matching Figma frame */
    .figma-artboard {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 450px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* 1. Top Headline: THE TIME IS ALMOST HERE! */
    .top-headline {
      position: absolute;
      top: 3%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Bungee', cursive;
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      color: #ffde00;
      text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      letter-spacing: -0.5px;
      padding: 0 16px;
      z-index: 20;
    }

    /* 2. Venue Burst Callout (Top Right) */
    .venue-burst {
      position: absolute;
      top: 14%;
      right: 5%;
      background: #ffde00;
      border: 3px solid #000;
      border-radius: 16px;
      padding: 10px 14px;
      width: 165px;
      text-align: center;
      box-shadow: 4px 4px 0px #000;
      transform: rotate(4deg);
      z-index: 20;
      text-decoration: none;
      display: block;
      transition: transform 0.1s;
    }
    .venue-burst:active { transform: rotate(4deg) translate(2px, 2px); }

    .venue-burst-text {
      font-family: 'Bungee', cursive;
      font-size: 0.6rem;
      color: #000;
      line-height: 1.2;
      text-transform: uppercase;
    }

    /* 3. Date Speech Bubble (Mid Right) */
    .date-bubble {
      position: absolute;
      top: 48%;
      right: 6%;
      background: #38bdf8;
      border: 3px solid #000;
      border-radius: 50%;
      width: 135px;
      height: 135px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 4px 4px 0px #000;
      z-index: 20;
      padding: 10px;
    }

    .date-bubble-title {
      font-family: 'Bungee', cursive;
      font-size: 0.6rem;
      color: #000;
      line-height: 1.1;
    }

    .date-bubble-sub {
      font-family: 'Bungee', cursive;
      font-size: 0.48rem;
      color: #dc2626;
      background: #fff;
      border: 2px solid #000;
      padding: 3px 6px;
      border-radius: 8px;
      margin-top: 6px;
      text-decoration: none;
      box-shadow: 1px 1px 0px #000;
    }

    /* 4. Action Buttons (Venue Map & RSVP) */
    .action-row {
      position: absolute;
      bottom: 24%;
      left: 5%;
      right: 5%;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
    }

    .comic-action-btn {
      flex: 1;
      background: #f472b6;
      border: 3px solid #000;
      padding: 10px;
      border-radius: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 4px 4px 0px #000;
      font-family: 'Bungee', cursive;
      font-size: 0.65rem;
      color: #000;
      transition: transform 0.1s;
    }
    .comic-action-btn.yellow { background: #facc15; }
    .comic-action-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }

    /* 5. Center Bottom Banner: MANSI & VIKAS SAVE THE DATE */
    .bottom-banner {
      position: absolute;
      bottom: 6%;
      left: 5%;
      right: 5%;
      background: #fffbeb;
      border: 4px solid #000;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 5px 5px 0px #000;
      z-index: 20;
    }

    .banner-names {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 2px;
    }

    .banner-subtitle {
      font-family: 'Bungee', cursive;
      font-size: 0.75rem;
      color: #dc2626;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Background Art & Overlay -->
  <div class="figma-canvas"></div>
  <div class="comic-overlay"></div>

  <!-- Background Audio Track -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- Figma Artboard Frame -->
  <div class="figma-artboard">

    <!-- Top Headline -->
    <div class="top-headline">THE TIME IS ALMOST HERE!</div>

    <!-- Venue Burst Callout -->
    <a 
      href="https://maps.google.com/?q=Geetashree+Garden+Nagda+Madhya+Pradesh" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="venue-burst"
    >
      <div class="venue-burst-text">📍 GEETASHREE GARDEN, NAGDA, M.P.</div>
    </a>

    <!-- Date Speech Bubble -->
    <div class="date-bubble">
      <div class="date-bubble-title">JAN 30 &amp; 31<br>2027</div>
      <a 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+Mansi+and+Vikas+at+Geetashree+Garden!&location=Geetashree+Garden,+Nagda,+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="date-bubble-sub"
      >
        + CAL
      </a>
    </div>

    <!-- Action Buttons Row -->
    <div class="action-row">
      <a 
        href="https://maps.google.com/?q=Geetashree+Garden+Nagda+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-action-btn"
      >
        <span>🗺️</span> VENUE MAP
      </a>
      <a 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+Mansi+and+Vikas+at+Geetashree+Garden!&location=Geetashree+Garden,+Nagda,+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-action-btn yellow"
      >
        <span>📅</span> RSVP / CAL
      </a>
    </div>

    <!-- Bottom Banner -->
    <div class="bottom-banner">
      <div class="banner-names">Mansi &amp; Vikas</div>
      <div class="banner-subtitle">Save The Date</div>
    </div>

  </div>

  <script>
    // Automatic Audio Playback
    window.addEventListener('DOMContentLoaded', () => {
      const bgMusic = document.getElementById('bgMusic');
      bgMusic.play().catch(() => {
        document.body.addEventListener('click', () => {
          bgMusic.play();
        }, { once: true });
      });
    });
  </script>
</body>
</html>
