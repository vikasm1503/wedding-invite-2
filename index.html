<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAVE THE DATE • Mansi & Vikas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0d14;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cinematic Ambient Background for Laptop View */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      background: url('couple.jpg') center/cover no-repeat;
      filter: blur(25px) brightness(0.3);
      transform: scale(1.1);
      z-index: 0;
    }

    /* True Responsive Container (Works like a mobile app frame on laptops, full screen on phones) */
    .app-frame {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 420px;
      max-height: 850px;
      background: url('couple.jpg') center/cover no-repeat;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }

    @media (min-width: 768px) {
      .app-frame {
        border: 4px solid #1e293b;
        border-radius: 32px;
      }
    }

    .comic-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.12);
      z-index: 1;
      pointer-events: none;
    }

    /* Top Headline */
    .top-headline {
      position: absolute;
      top: 2.5%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Bungee', cursive;
      font-size: clamp(0.85rem, 3.5vw, 1.05rem);
      color: #ffde00;
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000;
      letter-spacing: 0.5px;
      z-index: 20;
    }

    /* Top Control Bar */
    .top-control-bar {
      position: absolute;
      top: 9%;
      left: 3%;
      right: 3%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 25;
      gap: 6px;
    }

    .comic-badge {
      border: 2px solid #000;
      border-radius: 12px;
      padding: 6px 10px;
      font-family: 'Bungee', cursive;
      font-size: 0.48rem;
      color: #000;
      text-decoration: none;
      box-shadow: 3px 3px 0px #000;
      text-align: center;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.1s;
    }
    .comic-badge:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000; }

    .date-badge { background: #38bdf8; transform: rotate(-1.5deg); }
    .sound-badge { background: #f472b6; transform: rotate(0deg); }
    .venue-badge { background: #ffde00; transform: rotate(1.5deg); }

    /* Side Comic Photo Frame Accent */
    .comic-polaroid {
      position: absolute;
      top: 22%;
      right: 4%;
      background: #fff;
      border: 2px solid #000;
      padding: 4px 4px 16px 4px;
      width: 65px;
      box-shadow: 3px 3px 0px #000;
      transform: rotate(6deg);
      z-index: 5;
      pointer-events: none;
    }
    .comic-polaroid img {
      width: 100%;
      height: 55px;
      object-fit: cover;
      border: 1px solid #000;
    }
    .comic-polaroid span {
      display: block;
      font-family: 'Bungee', cursive;
      font-size: 0.35rem;
      color: #000;
      text-align: center;
      margin-top: 3px;
    }

    /* Bottom Compact Banner */
    .bottom-banner {
      position: absolute;
      bottom: 3%;
      left: 4%;
      right: 4%;
      background: #fffbeb;
      border: 3px solid #000;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      box-shadow: 4px 4px 0px #000;
      z-index: 20;
    }

    .banner-names {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 1px;
    }

    .banner-subtitle {
      font-family: 'Bungee', cursive;
      font-size: 0.6rem;
      color: #dc2626;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Ambient Backdrop for Laptops -->
  <div class="ambient-backdrop"></div>

  <!-- Background Audio Track -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- Responsive App Frame Container -->
  <div class="app-frame" id="appFrame">
    <div class="comic-overlay"></div>

    <!-- Top Headline -->
    <div class="top-headline">THE TIME IS ALMOST HERE!</div>

    <!-- Side Comic Accent Frame -->
    <div class="comic-polaroid">
      <img src="couple.jpg" alt="Mansi & Vikas">
      <span>FOREVER</span>
    </div>

    <!-- Top Control Bar -->
    <div class="top-control-bar">
      <!-- Calendar Pill -->
      <a 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+Mansi+and+Vikas+at+Geetashree+Garden!&location=Geetashree+Garden,+Nagda,+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-badge date-badge"
      >
        📅 JAN 30-31<br><span style="color:#dc2626; font-size:0.38rem;">+ ADD CAL</span>
      </a>

      <!-- Sound Toggle Status Pill -->
      <div class="comic-badge sound-badge" id="soundTogglePill">
        🎵 SOUND<br><span id="soundStatus" style="color:#000; font-size:0.38rem;">OFF</span>
      </div>

      <!-- Venue Map Pill -->
      <a 
        href="https://maps.google.com/?q=Geetashree+Garden+Nagda+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-badge venue-badge"
      >
        📍 VENUE<br><span style="color:#0369a1; font-size:0.38rem;">MAPS →</span>
      </a>
    </div>

    <!-- Bottom Compact Banner -->
    <div class="bottom-banner">
      <div class="banner-names">Mansi &amp; Vikas</div>
      <div class="banner-subtitle">Save The Date • Nagda, M.P.</div>
    </div>

  </div>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const soundStatus = document.getElementById('soundStatus');
    const soundTogglePill = document.getElementById('soundTogglePill');
    const appFrame = document.getElementById('appFrame');
    let isPlaying = false;

    function toggleAudio() {
      if (isPlaying) {
        bgMusic.pause();
        soundStatus.textContent = 'OFF';
        soundTogglePill.style.background = '#f472b6';
      } else {
        bgMusic.play().then(() => {
          soundStatus.textContent = 'ON';
          soundTogglePill.style.background = '#4ade80';
        }).catch((err) => {
          console.log("Audio play blocked or error:", err);
        });
      }
      isPlaying = !isPlaying;
    }

    // Tap anywhere inside the app frame or background to toggle sound (unless clicking a link)
    document.addEventListener('click', (e) => {
      if (e.target.closest('a')) return; // Let links open normally
      toggleAudio();
    });
  </script>
</body>
</html>
