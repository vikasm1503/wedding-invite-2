<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAVE THE DATE • Mansi & Vikas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f17;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    /* Full-Screen Edge-to-Edge Comic Background */
    .figma-canvas {
      position: fixed;
      inset: 0;
      background: url('couple.jpg') center/cover no-repeat;
      z-index: 0;
    }

    .comic-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.1);
      z-index: 1;
      pointer-events: none;
    }

    /* Artboard Frame */
    .figma-artboard {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 450px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* Top Headline */
    .top-headline {
      position: absolute;
      top: 2%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Bungee', cursive;
      font-size: clamp(0.85rem, 3.5vw, 1.1rem);
      color: #ffde00;
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000;
      letter-spacing: 0.5px;
      z-index: 20;
    }

    /* Top Control Bar (Pushed down slightly) */
    .top-control-bar {
      position: absolute;
      top: 8.5%;
      left: 3%;
      right: 3%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 25;
      gap: 6px;
    }

    .comic-badge {
      border: 2px solid #000;
      border-radius: 12px;
      padding: 6px 10px;
      font-family: 'Bungee', cursive;
      font-size: 0.5rem;
      color: #000;
      text-decoration: none;
      box-shadow: 3px 3px 0px #000;
      text-align: center;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.1s;
    }
    .comic-badge:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000; }

    .date-badge { background: #38bdf8; transform: rotate(-1.5deg); }
    .sound-badge { background: #f472b6; transform: rotate(0deg); }
    .venue-badge { background: #ffde00; transform: rotate(1.5deg); }

    /* Animated Comic Stickers in the Empty Sky Space */
    .comic-sticker {
      position: absolute;
      font-family: 'Bungee', cursive;
      z-index: 5;
      pointer-events: none;
      animation: floatSticker 4s ease-in-out infinite alternate;
    }

    .sticker-1 {
      top: 18%;
      left: 10%;
      font-size: 1.2rem;
      animation-delay: 0s;
    }

    .sticker-2 {
      top: 16%;
      right: 12%;
      font-size: 1.3rem;
      animation-delay: 1.5s;
    }

    .sticker-3 {
      top: 28%;
      left: 6%;
      font-size: 1rem;
      animation-delay: 0.8s;
    }

    @keyframes floatSticker {
      0% { transform: translateY(0px) rotate(-5s); }
      100% { transform: translateY(-8px) rotate(5deg); }
    }

    /* Bottom Compact Banner */
    .bottom-banner {
      position: absolute;
      bottom: 3%;
      left: 4%;
      right: 4%;
      background: #fffbeb;
      border: 3px solid #000;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      box-shadow: 4px 4px 0px #000;
      z-index: 20;
    }

    .banner-names {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 1px;
    }

    .banner-subtitle {
      font-family: 'Bungee', cursive;
      font-size: 0.6rem;
      color: #dc2626;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Background Art & Overlay -->
  <div class="figma-canvas"></div>
  <div class="comic-overlay"></div>

  <!-- Background Audio Track -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- Artboard Frame -->
  <div class="figma-artboard">

    <!-- Top Headline -->
    <div class="top-headline">THE TIME IS ALMOST HERE!</div>

    <!-- Animated Comic Stickers in Empty Sky Area -->
    <div class="comic-sticker sticker-1">✨💖</div>
    <div class="comic-sticker sticker-2">💫</div>
    <div class="comic-sticker sticker-3">💖✨</div>

    <!-- Pushed-Down Top Control Bar -->
    <div class="top-control-bar">
      <!-- Calendar Pill -->
      <a 
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Mansi+Karandikar+%26+Vikas+Mishra&dates=20270130/20270201&details=Save+the+Date+for+Mansi+and+Vikas+at+Geetashree+Garden!&location=Geetashree+Garden,+Nagda,+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-badge date-badge"
      >
        📅 JAN 30-31<br><span style="color:#dc2626; font-size:0.4rem;">+ ADD CAL</span>
      </a>

      <!-- Sound Toggle Status Pill -->
      <div class="comic-badge sound-badge" id="soundTogglePill">
        🎵 SOUND<br><span id="soundStatus" style="color:#000; font-size:0.4rem;">OFF</span>
      </div>

      <!-- Venue Map Pill -->
      <a 
        href="https://maps.google.com/?q=Geetashree+Garden+Nagda+Madhya+Pradesh" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="comic-badge venue-badge"
      >
        📍 VENUE<br><span style="color:#0369a1; font-size:0.4rem;">MAPS →</span>
      </a>
    </div>

    <!-- Bottom Compact Banner -->
    <div class="bottom-banner">
      <div class="banner-names">Mansi &amp; Vikas</div>
      <div class="banner-subtitle">Save The Date • Nagda, M.P.</div>
    </div>

  </div>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const soundStatus = document.getElementById('soundStatus');
    const soundTogglePill = document.getElementById('soundTogglePill');
    let isPlaying = false;

    // Tap anywhere on the screen (except direct button links) to toggle music
    document.addEventListener('click', (e) => {
      // If user clicked a link/badge inside top bar, let it handle its own href
      if (e.target.closest('a')) return;

      if (isPlaying) {
        bgMusic.pause();
        soundStatus.textContent = 'OFF';
        soundTogglePill.style.background = '#f472b6';
      } else {
        bgMusic.play().then(() => {
          soundStatus.textContent = 'ON';
          soundTogglePill.style.background = '#4ade80';
        }).catch(() => {});
      }
      isPlaying = !isPlaying;
    });

    // Dedicated tap specifically on the sound status pill to toggle audio easily
    soundTogglePill.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        soundStatus.textContent = 'OFF';
        soundTogglePill.style.background = '#f472b6';
      } else {
        bgMusic.play().then(() => {
          soundStatus.textContent = 'ON';
          soundTogglePill.style.background = '#4ade80';
        }).catch(() => {});
      }
      isPlaying = !isPlaying;
    });
  </script>
</body>
</html>
